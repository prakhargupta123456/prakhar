unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

# Disable DPDK mode
# dpdk {
#   dev 0000:15:00.0
# }

# Create TAP interface for kernel mode
create tap host-if-name vpp-tap0
set interface state tap0 up

# Optional: Configure IP address
# set interface ip address tap0 192.168.1.100/24

# Enable UPF plugin
upf {
  # UPF specific configuration
}