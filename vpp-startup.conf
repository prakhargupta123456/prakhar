unix {
  nodaemon
  log /var/log/vpp/vpp.log
  full-coredump
  cli-listen /run/vpp/cli.sock
  gid vpp
}

# Disable DPDK mode - comment out or remove the dpdk section
# dpdk {
#   dev 0000:15:00.0
# }

# Use AF_PACKET for kernel mode interface
create host-interface name eth0
set interface state host-eth0 up

# Optional: Configure IP address if needed
# set interface ip address host-eth0 192.168.1.100/24

# Enable UPF plugin
upf {
  # UPF specific configuration
}